name: carbmate
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  sqlite_async: ^0.14.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/database/migrations/initial_db.sql
    - assets/database/migrations/datos_iniciales.sql
    - assets/database/migrations/add_measure_eliminable.sql
    - assets/images/carbmate_mascot.png
    - assets/images/carbmate_launcher.png
